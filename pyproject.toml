[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "ninja",
    "torch",
    "numpy",
    "rich",
]
build-backend = "setuptools.build_meta"

[project]
name = "gsplat"
dynamic = ["version"]
description = "Python package for differentiable rasterization of gaussians"
requires-python = ">=3.13"
dependencies = [
    "ninja",
    "numpy",
    "jaxtyping",
    "rich>=12",
    "torch",
    "typing_extensions; python_version<'3.8'",
]

[project.optional-dependencies]
lidar = [
    "scipy",
]
dev = [
    "black[jupyter]==22.3.0",
    "isort==5.10.1",
    "pylint==2.13.4",
    "pytest==7.1.3",
    "pytest-env==0.8.1",
    "pytest-xdist==2.5.0",
    "typeguard>=2.13.3",
    "pyyaml>=6.0.1",
    "build",
    "twine",
    "cupy",
    "nerfacc>=0.5.3",
    "PLAS @ git+https://github.com/fraunhoferhhi/PLAS.git",
    "imageio>=2.37.2",
    "torchpq>=0.3.0.6",
]

[tool.setuptools.dynamic]
version = {attr = "gsplat.version.__version__"}

[dependency-groups]
gsplat-metal = [
    "jupyter",
    "ninja",
    "numpy",
    "rich>=12",
    "jaxtyping",
    "pytest",
    "pytest-env",
    "setuptools",
    "wheel",
    "torch==2.11.*",
    "black[jupyter]==22.3.0",
    "isort==5.10.1",
    "pylint==2.13.4",
    "pytest-xdist==2.5.0",
    "typeguard>=2.13.3",
    "pyyaml>=6.0.1",
    "build",
    "twine",
    "imageio>=2.37.2",
]

[tool.uv]
default-groups = ["gsplat-metal"]
